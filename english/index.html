<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="إيليا وفينوم">
<meta name="theme-color" content="#2f6f8f">
<title>إيليا وفينوم — مغامرة الإنجليزي</title>
<link rel="icon" href="../assets/icon.png">
<link rel="apple-touch-icon" href="../assets/icon.png">
<link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>

<!-- الشاشة الأولى -->
<section id="home" class="screen on">
  <div class="bg" style="background-image:url(img/bg_cover.webp)"></div>
  <a class="back" href="../" aria-label="رجوع">‹ <span>الْأَلْعاب</span></a>
  <div class="home-box">
    <h1 class="logo"><span class="en">Elia <b>&amp;</b> Venom</span><span class="ar">مُغامَرَةُ الْإِنْجِليزِيِّ</span></h1>
    <div class="heroes">
      <img id="h-elia" src="img/elia_hello.webp" alt="إيليا">
      <img id="h-venom" src="img/venom_hi.webp?v=2" alt="فينوم">
    </div>
    <div class="home-stats" id="home-stats"></div>
    <button class="btn big go" id="play">▶ <span>Let's go!</span></button>
  </div>
</section>

<!-- الخريطة -->
<section id="map" class="screen">
  <div class="bg" id="map-bg"></div>
  <header class="bar">
    <button class="btn icon" id="map-home" aria-label="الرئيسية">⌂</button>
    <div class="tabs" id="tabs"></div>
    <div class="gems" id="map-gems"></div>
  </header>
  <div class="path-wrap" id="path-wrap"><div class="path" id="path"></div></div>
</section>

<!-- المستوى -->
<section id="level" class="screen">
  <div class="bg" id="lv-bg"></div>
  <header class="bar">
    <button class="btn icon" id="lv-back" aria-label="خروج">✕</button>
    <div class="progress"><i id="lv-prog"></i></div>
    <div class="combo" id="combo"></div>
    <div class="hearts" id="lv-hearts"></div>
  </header>
  <div class="stage" id="stage"></div>
  <div class="buddy" id="buddy">
    <div class="bubble" id="bubble"></div>
    <img id="buddy-img" src="img/venom_hi.webp?v=2" alt="">
  </div>
</section>

<!-- ألبوم الملصقات -->
<section id="album" class="screen">
  <div class="bg" style="background-image:url(img/bg_house.webp)"></div>
  <header class="bar">
    <button class="btn icon" id="album-back" aria-label="رجوع">‹</button>
    <h2 class="album-title">📒 أَلْبومُ الْمُلْصَقاتِ <span class="chip" id="album-count"></span></h2>
  </header>
  <div class="album-wrap"><p class="album-hint">كُلُّ مَرْحَلَةٍ تُعْطيكَ مُلْصَقاتٍ، وَبِثَلاثِ نُجومٍ تَصيرُ ذَهَبِيَّةً ✨ — اِضْغَطْ عَلى الْمُلْصَقِ لِتَسْمَعَهُ</p><div id="album-pages"></div></div>
</section>

<!-- الاحتفال بصوت إيليا -->
<div id="celebrate"><div class="c-in"><img id="c-img" alt=""><div id="c-say"></div></div></div>
<div id="toast"></div>
<div id="modal" class="modal"><div class="card" id="modal-card"></div></div>

<script src="js/data.js?v=10"></script>
<script src="js/app.js?v=10"></script>
</body>
</html>
